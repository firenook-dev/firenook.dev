# Every push and pull request builds the site and checks it; a push to main
# also deploys it to firenook.dev. Pull requests never see the Cloudflare token.
name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One deploy at a time, in the order of the pushes.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Build, check and deploy
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Each docs page's "Last updated" date comes from the history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:site
      - run: npm run package
      - run: npx cf deploy --prebuilt --dry-run
      - name: Deploy to firenook.dev
        if: github.event_name == 'push'
        run: npm run deploy -- --message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
